server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Cabeceras de seguridad ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # CSP imprescindible para que el dashboard en vivo (slide 4) funcione:
    #  - frame-src 'self'        -> permite el iframe del dashboard
    #  - connect-src docs.google / *.googleusercontent -> fetch del CSV (redirige a googleusercontent)
    #  - 'unsafe-inline' (script/style) -> estilos en línea del deck y el onclick del botón "Actualizar"
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # Cacheo de estáticos
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
